services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lotus_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=Lotus Capital API
      - API_V1_STR=/api/v1
      - CORS_ORIGINS=http://localhost,http://localhost:8080,http://127.0.0.1:8080
      - SECRET_KEY=replace_with_a_secure_random_hex_key_at_least_32_bytes
      - SECURITY_PASSWORD_PEPPER=replace_with_a_high_entropy_pepper_value_in_prod
      - ACCESS_TOKEN_EXPIRE_MINUTES=720
      - UPLOAD_DIR=/app/uploads
      - DATABASE_URL=sqlite:////app/data/lotus_capital.db
    volumes:
      - lotus_db:/app/data
      - lotus_uploads:/app/uploads
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lotus_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lotus_frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lotus_network

networks:
  lotus_network:
    driver: bridge

volumes:
  lotus_db:
    driver: local
  lotus_uploads:
    driver: local

