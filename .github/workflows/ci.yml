name: Lotus Capital CI/CD Quality & Security Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-security:
    name: Backend Test Suite & Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pip-audit

      - name: Run Pytest Suite (58 Tests)
        env:
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_minimum_32_characters_long_for_ci
          SECURITY_PASSWORD_PEPPER: test_pepper_for_argon2_hashing_gate
          DATABASE_URL: sqlite:///:memory:
        run: |
          pytest -v

      - name: Security Vulnerability Scan (pip-audit)
        run: |
          pip-audit --desc on || true

  frontend-test-and-build:
    name: Frontend Lint, Typecheck, Vitest & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Vitest Unit & Integration Suite
        run: npm test -- --run

      - name: Vite Production Build Verification
        run: npm run build

      - name: NPM Security Audit
        run: npm audit --audit-level=high || true

  docker-build-verification:
    name: Docker Build Health Gate
    needs: [ backend-test-and-security, frontend-test-and-build ]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: lotus-capital-backend:ci-check

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: lotus-capital-frontend:ci-check

